# 固定同义问句集：同一个业务意图的不同说法。
#
# 存在的理由：关键词基线在字面重合上能工作，而真实的产品/运营不会照着文档的
# 措辞提问。这组问句衡量的正是"换个说法还找不找得到"。
#
# `gold` 是该问句**应当**检索到的片段所在章节。分母只含该主体有权且适用的证据。
# 语料在 examples/knowledge/，文档只写规则不写数字（演示数据日期相对今天生成）。

workspace: ops

cases:
  - intent: new_users_basis
    gold: ["运营数据手册 › 新增用户"]
    questions:
      - 新增用户怎么算
      - 拉新数是按什么口径统计的
      - 新注册多少人算一个新用户
      - 一个用户什么时候计入新增

  - intent: test_account_filter
    gold: ["运营数据手册 › 新增用户"]
    questions:
      - 测试账号要排除吗
      - 内部测试的号算不算进去
      - 统计的时候要不要剔除测试数据

  - intent: active_buyers
    gold: ["运营数据手册 › 活跃购买用户"]
    questions:
      - 活跃购买用户怎么定义
      - 下单用户数是去重的吗
      - 同一个人买两次算几个人

  - intent: gmv_basis
    gold: ["运营数据手册 › 成交额"]
    questions:
      - 成交额算哪些订单
      - GMV 按什么状态统计
      - 交易额归到哪一天
