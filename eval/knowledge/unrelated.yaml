# 不相关问句集：语料里没有、也不该检索到任何证据的问题。
#
# 存在的理由：检索质量不只是"找得到"，还有"没有就说没有"。语义检索会给任意
# 两段文本打出非零相似度，若下限不当，"没有相关证据"这个答案就永远不可达——
# 天气问题也会拿回运营手册。这组问题衡量的正是它（T31 验收项）。
#
# 前五条与电商口径无关；后三条是电商相邻、但语料没有覆盖的话题，是更难的一类。
#
# 诚实标注：这组问题写于 2026-09-10，写下时尚未看到它们的相似度分数；但默认
# 语义下限 0.5 是看过这组分数之后选定的，所以语义模式在这组题上的误检率是
# **样本内**数字，不能当作泛化表现。

workspace: ops

questions:
  - 机房温度多少
  - 今天天气怎么样
  - 帮我写一首关于秋天的诗
  - 服务器 CPU 使用率是多少
  - 公司年会在哪里办
  - 退货运费谁承担
  - 优惠券怎么核销
  - 客服响应时长怎么算
