[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "queryagent"
version = "0.4.0"
description = "Zero-infrastructure Text-to-SQL agent: schema-injected ReAct loop with YAML-declared business metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sun Weizhuo" }]
dependencies = [
    # Bounded on purpose: 1.0 removed Messages.create(temperature=...) and
    # broke CI without a line of our code changing. A major bump needs a look.
    "anthropic>=1.0,<2",
    # openai_compatible backend is hand-written over httpx instead of pulling
    # in the openai package (spec §四 dependency minimalism; ADR pending).
    # Upper bounds on every runtime dependency, for the reason above: a major
    # release can change an API under us between a local install and a CI run.
    # Raising a bound is a deliberate act with a test run behind it.
    "httpx>=0.27,<1",
    "sqlparse>=0.5,<1",
    "PyMySQL>=1.1,<2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
queryagent = "queryagent.cli:main"

[project.optional-dependencies]
clickhouse = ["clickhouse-driver>=0.2,<1"]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyMySQL",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["queryagent*"]

[tool.setuptools.package-data]
queryagent = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["queryagent", "tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sqlparse.*", "clickhouse_driver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
