name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The workflow scenarios (T46) are a release gate: they run on a fresh
      # demo database, and are required rather than skipped when it is missing.
      - name: Build the demo database for the scenario evaluation
        run: >-
          python examples/demo_ecommerce/generate_data.py
          --out "$RUNNER_TEMP/initdb" --sqlite-out "$RUNNER_TEMP/demo_shop.db"
      - run: make test
        env:
          QUERYAGENT_SCENARIO_DB: ${{ runner.temp }}/demo_shop.db
          QUERYAGENT_REQUIRE_DEMO: "1"

  # H13 on every push: the wheel, installed into a clean virtualenv, is the
  # whole product, carries nothing else, and runs a confirmed flow.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps -w dist .
      - run: python -m venv "$RUNNER_TEMP/clean"
      - run: '"$RUNNER_TEMP/clean/bin/pip" install dist/*.whl'
      - run: '"$RUNNER_TEMP/clean/bin/python" scripts/smoke_wheel.py dist/*.whl'
