name: release

# A tag v* builds, smoke-tests the wheel in a clean virtualenv, and then
# publishes a GitHub Release with the wheel and sdist attached — no PyPI
# account needed. PyPI is deliberately opt-in and never automatic:
#   - `workflow_dispatch` with target=testpypi rehearses against TestPyPI;
#   - `workflow_dispatch` with target=pypi uploads to PyPI, gated by the
#     `pypi` environment's required reviewers, using trusted publishing
#     (OIDC) so no token lives in this repository.
# PyPI upload is irreversible: a version uploaded can never be re-uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi (rehearsal) or pypi"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag names the version being built
        if: github.ref_type == 'tag'
        run: test -f "dist/queryagent-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python -m venv "$RUNNER_TEMP/clean"
      - run: '"$RUNNER_TEMP/clean/bin/pip" install dist/*.whl'
      - run: '"$RUNNER_TEMP/clean/bin/python" scripts/smoke_wheel.py dist/*.whl'

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: smoke
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Tag push publishes a GitHub Release with the built wheel and sdist
  # attached — no PyPI account or trusted publisher needed. PyPI upload is
  # kept as a manual, opt-in path only (workflow_dispatch below).
  github-release:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub Release with the built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  pypi:
    # PyPI is opt-in only: never on a tag push, only a deliberate manual run.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
