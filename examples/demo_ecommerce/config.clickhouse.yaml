# QueryAgent demo config — ClickHouse path (make demo-up-ch).
# Requires the extra driver: pip install -e ".[clickhouse]"
llm:
  backend: openai_compatible    # reads OPENAI_API_KEY (DeepSeek keys go here)
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0                # deterministic SQL + clarify decisions
  # 有 ANTHROPIC_API_KEY 时可切换 Anthropic：
  # backend: anthropic
  # model: claude-sonnet-5

database:
  type: clickhouse
  host: 127.0.0.1
  port: 9001          # host port mapped in docker-compose (native protocol)
  database: demo_shop
  user: demo
  password: demo_ch_password   # local demo default, matches docker-compose.yml

safety:
  timeout_s: 10
  max_rows: 200
