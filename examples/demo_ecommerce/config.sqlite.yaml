# QueryAgent demo config — SQLite path (no Docker needed).
# Run `make demo-data` first to produce demo_shop.db.
# API keys are NEVER put in config files (spec §二):
#   anthropic         -> export ANTHROPIC_API_KEY=...
#   openai_compatible -> export OPENAI_API_KEY=...   (DeepSeek keys go here too)
llm:
  backend: openai_compatible    # reads OPENAI_API_KEY (DeepSeek keys go here)
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0                # deterministic SQL + clarify decisions
  # 有 ANTHROPIC_API_KEY 时可切换 Anthropic：
  # backend: anthropic
  # model: claude-sonnet-5

database:
  type: sqlite
  path: examples/demo_ecommerce/demo_shop.db

safety:
  timeout_s: 10
  max_rows: 200

metrics_path: examples/metrics.yaml

# The confirmation-gated flow (`queryagent flow`). Without workflow.mappings_path
# the flow can prepare and confirm a 口径 but has nothing it is permitted to run.
workflow:
  mappings_path: examples/query_mappings.yaml
  state_path: .queryagent/workflow.db
  # 确认前的数据新鲜度提醒（ADR-010）：declared = 只用映射上声明的更新节奏，确认前零查询（默认）；
  # probe = 允许确认前跑一次 MAX(time_column) 探测（按表缓存、计入预算）；off = 只在结果上说。
  # freshness_before_confirm: declared
  # history_max_age_days: 90       # 「历史选择」最多沿用多久以前的确认

# 可选：维护者设定的总预算（ADR-011）。不写就没有总量上限；写了，命令行参数与模型都不能提高它。
# budget:
#   max_queries_per_request: 3     # 一次确认执行（含新鲜度探测）或一次 ask 的探索
#   max_queries_per_day: 200       # 每人每天的语句数
#   max_query_seconds_per_day: 600 # 每人每天累计执行秒数（客户端计时）
#   max_concurrent: 2              # 同时执行的请求数
#   # max_rows_scanned 只有 ClickHouse 能由引擎强制；在 SQLite 上配置会在加载时报错

# Document evidence (`queryagent kb import`, then `flow` cites what it finds).
# `root` confines document import: it reads every file it finds under a
# source, which is a filesystem read path no other layer here has.
knowledge:
  root: examples/knowledge
  index_path: .queryagent/knowledge.db
  sources:
    - path: examples/knowledge/ops
      workspace: ops
    # 同一业务空间里的第二个团队：它的文档与运营手册对「新增用户」口径说法不一，
    # 用来演示「文档之间的分歧」。检索评测只用 ops/ 目录，不受影响。
    - path: examples/knowledge/growth
      workspace: ops
  # 可选：语义检索。key 只从环境变量 QUERYAGENT_EMBEDDING_API_KEY 读，绝不写进本文件。
  # 启用后，`kb import` 会把文档正文发往 base_url——这是部署方要做的数据边界决定。
  # embedding:
  #   base_url: https://api.siliconflow.cn/v1
  #   model: BAAI/bge-m3
  #   min_similarity: 0.5   # 与模型相关，换模型须重新标定
