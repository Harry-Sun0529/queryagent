# Maintainer-declared 口径 → SQL mappings for the demo_shop dataset.
#
# This file is the reason the agent cannot invent a query: `queryagent flow`
# executes what is written here and nothing else. A 口径 with no entry is
# refused with MappingNotFound — which is the correct outcome, not a bug to
# work around by loosening the executor.
#
# Reviewing a mapping change is reviewing a PR, same as metrics.yaml. The
# numbers a whole team quotes come from these statements, so review them as
# such: a plausible-looking WHERE clause here is indistinguishable from a
# correct one at the point where someone reads the answer.

# Structured entries (v0.7): the compiler adds the confirmed 统计区间 as a
# condition on `time_column`. A whole-statement `sql:` entry still works, but
# refuses a period rather than silently running all-time.

# Dimensions a result may be split by (v0.8), declared per table: which
# column holds 渠道 in `users` is a maintainer's decision, like any SQL here.
# A metric whose mapping reads a table not listed cannot be split by it.
#
# `enforces` (v0.8) on a mapping names the rules its SQL applies and the
# words a handbook describing that rule would use. A verified document quote
# containing those words is shown as applied by (or contradicting) the
# reading that runs; words shared by several readings mean all of them apply
# it. Documents never become SQL — this only matches them to SQL written here.
dimensions:
  - key: channel
    label: 渠道
    aliases: [来源渠道, 获客渠道]
    columns: {users: channel}
  - key: region
    label: 地区
    aliases: [区域, 大区]
    columns: {users: region}

mappings:
  - metric: new_users
    variant: registered
    from: users
    measure: COUNT(*)
    label: 新增用户数
    time_column: created_at
    where:
      - channel <> 'internal_test'
    enforces:
      counting_basis: [created_at, 注册日期]
      filters: [internal_test]

  - metric: new_users
    variant: first_order
    from: users
    measure: COUNT(*)
    label: 新增用户数
    time_column: first_order_at
    where:
      - first_order_at IS NOT NULL
      - channel <> 'internal_test'
    enforces:
      counting_basis: [first_order_at, 首单日期]
      filters: [internal_test]

  - metric: gmv
    variant: paid
    from: orders
    measure: ROUND(SUM(amount), 2)
    label: 成交额
    time_column: created_at
    where:
      - status = 'paid'
    enforces:
      counting_basis: [created_at]
      amount_basis: [不扣除退款]

  - metric: gmv
    variant: net
    from: orders
    measure: >-
      ROUND(SUM(CASE WHEN status = 'paid' THEN amount ELSE 0 END)
      - SUM(CASE WHEN status = 'refunded' THEN amount ELSE 0 END), 2)
    label: 成交额净额
    time_column: created_at
    where:
      - status IN ('paid', 'refunded')
    # Words must tell readings apart: 「扣除」 alone would also match 「不扣除退款」,
    # and a quote matching both readings is treated as matching neither.
    enforces:
      counting_basis: [created_at]
      amount_basis: [净额, refunded]
      refund_handling: [冲减]
